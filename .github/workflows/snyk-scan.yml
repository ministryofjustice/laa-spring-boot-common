name: Snyk dependency scan

on:
  schedule:
    # 07:00 and 14:00 Europe/London, which is one hour earlier in UTC during BST.
    # Both UTC offsets are scheduled; the gate job lets only the runs at 07:00 and 14:00 UK time through.
    - cron: '0 6,13 * * *'
    - cron: '0 7,14 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Check it is a scan time in the UK
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          uk_hour=$(TZ=Europe/London date +%H)
          if [ "$EVENT_NAME" = "schedule" ] && [ "$uk_hour" != "07" ] && [ "$uk_hour" != "14" ]; then
            echo "UK hour is $uk_hour, skipping this scheduled trigger"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  snyk-scan:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Pinned to the commit of the open PR that adds Slack alerts; replace with the merged SHA.
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/snyk-sca-scan.yml@ce279fe6457112080aa01b824f67c37293811a42 # feat/snyk-sca-slack-alerts
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      scan_all_projects: true
      java_version: '25'
      java_distribution: corretto
      minimum_threshold: ${{ vars.SNYK_MINIMUM_THRESHOLD || 'high' }}
    secrets:
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TEAM_SLACK_WEBHOOK_URL: ${{ secrets.TEAM_SLACK_WEBHOOK_URL }}
