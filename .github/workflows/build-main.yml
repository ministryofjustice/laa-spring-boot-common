name: Build main

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        required: true
        default: "auto"
        description: "Release type"
        options: [ "auto", "none", "patch", "minor", "major" ]

jobs:
  release:
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/gradle-build-and-publish.yml@3064a59ebe41513997eb533f466acdc6e99d5c1b
    permissions:
      contents: write
      packages: write
    with:
      java_version: '25'
      java_distribution: 'corretto'
      # 'auto' = empty string → shared workflow auto-detects from conventional commits
      release_type: ${{ inputs.release_type != 'auto' && inputs.release_type || '' }}
      junit_results: 'false'
      junit_report: 'false'
      checkstyle_report: 'false'
      jacoco_coverage_report: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      github_app_id: ${{ vars.LAA_CCMS_CAAB_SERVICE_APP_ID }}
      github_app_private_key: ${{ secrets.LAA_CCMS_CAAB_SERVICE_KEY }}
      github_app_organisation: ministryofjustice
      sonatype_username: ${{ secrets.sonatypeUsername || secrets.SONATYPE_USERNAME }}
      sonatype_password: ${{ secrets.sonatypePassword || secrets.SONATYPE_PASSWORD }}
      gpg_signing_key: ${{ secrets.signingKey || secrets.GPG_SIGNING_KEY }}
      gpg_passphrase: ${{ secrets.signingPassword || secrets.GPG_PASSPHRASE }}
