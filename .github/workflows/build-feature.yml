name: Build feature

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-publish-snapshot:
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/gradle-build-and-publish.yml@0c06c747af49e3efb703717e6185cf693494d5a4 # v2.4.2
    permissions:
      contents: write
      packages: write
    with:
      java_version: '25'
      java_distribution: 'corretto'
      release_type: 'snapshot'
      junit_results: 'false'
      junit_report: 'false'
      checkstyle_report: 'false'
      jacoco_coverage_report: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      sonatype_username: ${{ secrets.sonatypeUsername || secrets.SONATYPE_USERNAME }}
      sonatype_password: ${{ secrets.sonatypePassword || secrets.SONATYPE_PASSWORD }}
      gpg_signing_key: ${{ secrets.signingKey || secrets.GPG_SIGNING_KEY }}
      gpg_passphrase: ${{ secrets.signingPassword || secrets.GPG_PASSPHRASE }}
