name: Publish 3.0.0-rc.1 (temporary)

on:
  push:
    branches: [ feat/publish-to-maven-central ]

jobs:
  publish-release-candidate:
    if: "${{ github.event.head_commit.message == 'ci: publish v3.0.0-rc.1' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: 3.0.0-rc.1
      SONATYPE_USERNAME: ${{ secrets.sonatypeUsername || secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.sonatypePassword || secrets.SONATYPE_PASSWORD }}
      GPG_SIGNING_KEY: ${{ secrets.signingKey || secrets.GPG_SIGNING_KEY }}
      GPG_PASSPHRASE: ${{ secrets.signingPassword || secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Check Sonatype credentials
        shell: bash
        run: |
          test -n "$SONATYPE_USERNAME"
          test -n "$SONATYPE_PASSWORD"
          test -n "$GPG_SIGNING_KEY"
          test -n "$GPG_PASSPHRASE"

      - name: Build and publish release candidate to Maven Central
        run: >
          ./gradlew
          check
          publishToSonatype
          closeAndReleaseSonatypeStagingRepository
          -Pversion="${VERSION}"
