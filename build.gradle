plugins {
    id 'checkstyle'
    id 'com.adarshr.test-logger' version '4.0.0'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

ext.mavenCentralGroup = "uk.gov.justice.service.laa"
group = ext.mavenCentralGroup

// Set Global Versions

// org.springframework.boot:spring-boot-gradle-plugin
// org.springframework.boot:spring-boot-dependencies
ext.springBootVersion = "4.1.0"

// io.spring.gradle:dependency-management-plugin
ext.springBootDependencyManagementPluginVersion = "1.1.7"

// com.github.ben-manes:gradle-versions-plugin
ext.gradleVersionsPluginVersion = "0.54.0"

// checkstyle
ext.checkstyleVersion = "10.26.0"

// com.adarshr:gradle-test-logger-plugin
ext.testLoggerPluginVersion = "4.0.0"

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            username = findProperty("sonatypeUsername") ?: System.getenv("SONATYPE_USERNAME")
            password = findProperty("sonatypePassword") ?: System.getenv("SONATYPE_PASSWORD")
        }
    }
    useStaging.set(provider {
        !version.toString().endsWith("-SNAPSHOT")
    })
}

subprojects {
    group = rootProject.ext.mavenCentralGroup

    // See https://github.com/gradle/gradle/issues/22317
    tasks.withType(Test).configureEach {
        it.jvmArgs = ["--add-opens=java.base/java.lang=ALL-UNNAMED"]
    }

    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    // All publishable modules now publish only to Maven Central (via the nexus-publish-plugin's
    // 'sonatype' repository, configured at the root). GitHub Packages publishing has been removed.
    apply plugin: 'maven-publish'
    apply plugin: 'signing'
    apply plugin: 'com.adarshr.test-logger'

    plugins.withType(JavaPlugin).configureEach {
        java {
            withSourcesJar()
            withJavadocJar()
        }
    }

    // Maven Central requires a javadoc jar; relax strict HTML doclint so that
    // pre-existing (non-standard) Javadoc comments don't fail the build.
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    publishing.publications.withType(MavenPublication).configureEach {
        pom {
            name = "${groupId}:${artifactId}"
            description = "Common Java and Spring Boot Gradle build logic for Legal Aid Agency applications."
            url = "https://github.com/ministryofjustice/laa-spring-boot-common"
            licenses {
                license {
                    name = "MIT License"
                    url = "https://opensource.org/license/mit"
                }
            }
            developers {
                developer {
                    id = "ministryofjustice"
                    name = "Ministry of Justice"
                    organization = "Ministry of Justice"
                    organizationUrl = "https://www.gov.uk/government/organisations/ministry-of-justice"
                }
            }
            scm {
                connection = "scm:git:https://github.com/ministryofjustice/laa-spring-boot-common.git"
                developerConnection = "scm:git:ssh://git@github.com:ministryofjustice/laa-spring-boot-common.git"
                url = "https://github.com/ministryofjustice/laa-spring-boot-common"
            }
        }
    }

    signing {
        def signingKey = findProperty("signingKey") ?: System.getenv("GPG_SIGNING_KEY")
        def signingPassword = findProperty("signingPassword") ?: System.getenv("GPG_PASSPHRASE")

        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications
    }

    tasks.withType(AbstractPublishToMaven).configureEach {
        doLast {
            logger.lifecycle("Published Maven artifact: " +
                    "${publication.groupId}:${publication.artifactId}:${publication.version}")
        }
    }
}
